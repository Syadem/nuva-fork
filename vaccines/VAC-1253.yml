name: CHIMERIVAX-JE
description: Live attenuated Japanese encephalitis vaccine, recombinant chimeric
notes: Japanese encephalitis (JE) is a disease of the CNS caused by Japanese encephalitis virus (JEV). The disease appears in the form of frequent outbreaks in most south- and southeast Asian countries and the virus has become endemic in several areas. There is no licensed therapy available and disease control by vaccination is considered to be most effective. Mouse brain-derived inactivated JE vaccines, although immunogenic, have several limitations in terms of safety, availability and requirement for multiple doses. Owing to these drawbacks, the WHO called for the development of novel, safe and more efficacious JE vaccines. Several candidate vaccines have been developed and at least three of them that demonstrated strong immunogenicity after one or two doses of the vaccine in animal models were subsequently tested in various clinical trials. One of these vaccines, IMOJEV® (JE-CV and previously known as ChimeriVax™-JE), is a novel recombinant chimeric virus vaccine, developed using the Yellow fever virus (YFV) vaccine vector YFV17D, by replacing the cDNA encoding the envelope proteins of YFV with that of an attenuated JEV strain SA14-14-2. IMOJEV was found to be safe, highly immunogenic and capable of inducing long-lasting immunity in both preclinical and clinical trials. Moreover, a single dose of IMOJEV was sufficient to induce protective immunity, which was similar to that induced in adults by three doses of JE-VAX®, a mouse brain-derived inactivated JE vaccine. Recently, Phase III trials evaluating the immunogenicity and safety of the chimeric virus vaccine have been successfully completed in some JE-endemic countries and the vaccine manufacturers have filed an application for vaccine registration. IMOJEV may thus be licensed for use in humans as an improved alternative to the currently licensed JE vaccines.
