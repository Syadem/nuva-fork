name: Run RSpec tests

on: [push]

permissions:
  contents: read

jobs:
  run-rspec-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.1'
          bundler-cache: true
      - name: Run specs
        run: bundle exec rspec
